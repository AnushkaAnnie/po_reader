name: SRM PO Automation

on:
  schedule:
    - cron: '30 1,3,5,7,9,11,13,15 * * 1-5'

  workflow_dispatch:
    inputs:
      customer:
        description: 'Customer ID (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no sheet writes)'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-automation:
    name: SRM PO Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Create service account file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service-account.json

      - name: Run automation
        env:
          V2RETAIL_SRM_URL:  ${{ secrets.V2RETAIL_SRM_URL }}
          V2RETAIL_SRM_USER: ${{ secrets.V2RETAIL_SRM_USER }}
          V2RETAIL_SRM_PASS: ${{ secrets.V2RETAIL_SRM_PASS }}
          V2RETAIL_SHEET_ID: ${{ secrets.V2RETAIL_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ./service-account.json
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:    ${{ secrets.ALERT_EMAIL_TO }}
          HEADLESS: "true"
          LOG_LEVEL: "INFO"
        run: |
          CUSTOMER="${{ github.event.inputs.customer }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          ARGS=""
          if [ -n "$CUSTOMER" ]; then
            ARGS="--customer $CUSTOMER"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python main.py $ARGS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srm-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srm-snapshots-${{ github.run_id }}
          path: snapshots/
          retention-days: 30
