name: SRM PO Automation

on:
  schedule:
    - cron: '30 1,3,5,7,9,11,13,15 * * 1-5'
  workflow_dispatch:
    inputs:
      customer:
        description: 'Customer ID (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no sheet writes)'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-automation:
    name: SRM PO Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Verify Playwright works
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--no-sandbox'])
              page = browser.new_page()
              page.goto('https://example.com')
              print('✅ Playwright browser OK — title:', page.title())
              browser.close()
          "

      - name: Create service account file
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service-account.json
            echo "✅ Service account file created"
          else
            echo '{}' > service-account.json
            echo "⚠️  GOOGLE_SERVICE_ACCOUNT_JSON not set — Sheets sync will be skipped"
          fi
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Check required secrets
        run: |
          MISSING=0
          [ -z "$V2RETAIL_SRM_URL" ]  && echo "❌ Missing: V2RETAIL_SRM_URL"  && MISSING=1 || echo "✅ V2RETAIL_SRM_URL"
          [ -z "$V2RETAIL_SRM_USER" ] && echo "❌ Missing: V2RETAIL_SRM_USER" && MISSING=1 || echo "✅ V2RETAIL_SRM_USER"
          [ -z "$V2RETAIL_SRM_PASS" ] && echo "❌ Missing: V2RETAIL_SRM_PASS" && MISSING=1 || echo "✅ V2RETAIL_SRM_PASS"
          if [ "$MISSING" = "1" ]; then
            echo ""
            echo "Add secrets at: https://github.com/AnushkaAnnie/po_reader/settings/secrets/actions"
            exit 1
          fi
          echo "✅ All required secrets present"
        env:
          V2RETAIL_SRM_URL:  ${{ secrets.V2RETAIL_SRM_URL }}
          V2RETAIL_SRM_USER: ${{ secrets.V2RETAIL_SRM_USER }}
          V2RETAIL_SRM_PASS: ${{ secrets.V2RETAIL_SRM_PASS }}

      - name: Run SRM automation
        env:
          V2RETAIL_SRM_URL:            ${{ secrets.V2RETAIL_SRM_URL }}
          V2RETAIL_SRM_USER:           ${{ secrets.V2RETAIL_SRM_USER }}
          V2RETAIL_SRM_PASS:           ${{ secrets.V2RETAIL_SRM_PASS }}
          V2RETAIL_SHEET_ID:           ${{ secrets.V2RETAIL_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ./service-account.json
          SLACK_WEBHOOK_URL:           ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST:                   ${{ secrets.SMTP_HOST }}
          SMTP_PORT:                   ${{ secrets.SMTP_PORT }}
          SMTP_USER:                   ${{ secrets.SMTP_USER }}
          SMTP_PASS:                   ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:              ${{ secrets.ALERT_EMAIL_TO }}
          HEADLESS: "true"
          LOG_LEVEL: "INFO"
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.customer }}" ] && ARGS="--customer ${{ github.event.inputs.customer }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python main.py $ARGS

      - name: Ensure output dirs exist
        if: always()
        run: mkdir -p logs snapshots

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srm-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srm-snapshots-${{ github.run_id }}
          path: snapshots/
          retention-days: 30
          if-no-files-found: ignore
