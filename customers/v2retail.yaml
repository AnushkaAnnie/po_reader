customer_id: v2retail
customer_name: V2 Retail

portal_url_env: V2RETAIL_SRM_URL
auth:
  username_env: V2RETAIL_SRM_USER
  password_env: V2RETAIL_SRM_PASS

google_sheet:
  sheet_id_env: V2RETAIL_SHEET_ID
  tab_name: PO Tracker
  columns:
    date: A
    po_number: B
    status: C
    update_info: D
    category: E

crawler:
  po_list_path: /vendor/pending-pos
  wait_after_login_ms: 3000
  wait_after_navigate_ms: 2000
  scroll_to_load: true
  max_pages: 50

schedule:
  interval_minutes: 120
  active_hours_start: "07:00"
  active_hours_end: "21:00"
  timezone: Asia/Kolkata
  jitter_seconds: 90

validation:
  po_number_pattern: ".*"
  amount_min: 0
  amount_change_alert_pct: 20
  required_fields:
    - po_number
    - status

notifications:
  on_new_po: true
  on_cancelled_po: true
  on_updated_po: true
  channels:
    - slack
    - email
